<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="diagTitle diagDesc">
<title id="diagTitle">单一数据源与三层审计闭环</title>
<desc id="diagDesc">skill.manifest.json 作为版本单一数据源，经同步器与生成器发散，再由三层审计与 CI 门禁收敛校验。</desc>
<rect width="720" height="450" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="230" y="26" width="260" height="58" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="360" y="47" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">skill.manifest.json</text>
<text x="360" y="66" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">版本 · 能力 · 运行时文件 · 分发边界</text>

<path d="M360 84 L360 110" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M360 84 L186 110" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M360 84 L534 110" fill="none" stroke="#888780" stroke-width="1.5"/>

<rect x="40" y="114" width="292" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="186" y="134" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">sync_version.py --write</text>
<text x="186" y="153" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">回写 SKILL.md / README 等身份标记</text>

<rect x="388" y="114" width="292" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="534" y="134" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">gen_plugin_manifests.py</text>
<text x="534" y="153" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">生成 .claude-plugin/ 客户端清单</text>

<path d="M186 168 L186 204" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M534 168 L534 204" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="208" width="640" height="62" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="360" y="230" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">三层审计 —— 合计 50+ 项，全部只读、可独立运行</text>
<text x="360" y="252" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">capability_audit(30) · skill_quality_audit(6) · doc_consistency_audit(20 起，动态)</text>

<path d="M360 270 L360 306" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="310" width="302" height="56" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="191" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">package_skill.py</text>
<text x="191" y="349" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#633806" text-anchor="middle" dominant-baseline="central">产出 .skill / .zip（按分发排除）</text>

<rect x="378" y="310" width="302" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="529" y="330" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">CI required checks</text>
<text x="529" y="349" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">任一失败即阻断合并</text>

<rect x="40" y="386" width="640" height="46" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="360" y="409" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">设计取向：凡可由源生成的内容一律不手写 —— 把「声明漂移」变成机器可拦截的失败</text>
</svg>
