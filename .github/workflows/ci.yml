name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: Guards (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 本包 Node 与 Python 两侧都是零第三方依赖，因此**没有 install 步骤**。
      # 若将来引入依赖，请在此处补安装，并同步更新 package.json。
      - name: Toolchain versions
        run: python --version

      - name: Version markers are in sync
        run: python devtools/sync_version.py

      - name: Client plugin manifests are generated from the skill manifest
        run: python devtools/gen_plugin_manifests.py

      - name: Capability matrix audit
        run: python devtools/capability_audit.py

      - name: Skill quality audit
        run: python devtools/skill_quality_audit.py

      - name: Documentation consistency audit
        run: python .harness/scripts/doc_consistency_audit.py

      # 端到端离线评测。刻意**不加** --strict：CI 里没有 test-output/（本地验证
      # 产物，已 gitignore），expected_outputs 会退化为 warn —— 这正是设计意图。
      # eval 会以退出码 0 通过，只对"能力声明缺失"（fail）报警。
      - name: Offline end-to-end eval
        run: python .harness/eval/run_eval.py

      - name: Python tests (scan / knowledge / devtools)
        run: python -m unittest discover -s test -p "test_*.py"

  node-tests:
    # 在 package.json 声明的 engines 区间（>=18）上全量验证。
    # 这个矩阵不是装饰：`node --test` 的 glob 参数支持是 v21 才加入的，
    # 用 glob 写测试命令会在 18/20 上直接失败 —— 本矩阵正是为了拦住这类问题。
    name: Node tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Node version
        run: node --version

      - name: Node tests (activation, adapter routing, test discovery)
        run: npm test
