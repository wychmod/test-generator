<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530" role="img" aria-labelledby="diagTitle diagDesc">
<title id="diagTitle">宿主激活流程与幂等清理</title>
<desc id="diagDesc">test-generator activate 的执行流程：解析环境目标、收集运行时文件、两级清理、复制文件写状态、写宿主入口，底部标注安全边界。</desc>
<rect width="720" height="530" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="26" width="210" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="145" y="44" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">test-generator activate</text>
<text x="145" y="63" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">&lt;env|all&gt; [-g] [--target] [--dry-run]</text>

<path d="M250 51 L288 51" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="294" y="26" width="200" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="394" y="44" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">解析环境与目标目录</text>
<text x="394" y="63" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">别名归一 + 本地/全局路径</text>

<rect x="508" y="26" width="164" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="590" y="44" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">收集运行时文件</text>
<text x="590" y="63" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">读 manifest 清单</text>

<path d="M394 76 L394 110" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="254" y="114" width="280" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="394" y="134" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">两级清理（仅非 dry-run）</text>
<text x="394" y="153" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">只删自己写过的 + 归属明确目录</text>

<path d="M254 142 L214 142" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="118" width="168" height="48" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="124" y="135" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#412402" text-anchor="middle" dominant-baseline="central">pruneStaleFiles</text>
<text x="124" y="153" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">按状态文件比对</text>

<path d="M534 142 L576 142" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="582" y="118" width="96" height="48" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="630" y="135" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#412402" text-anchor="middle" dominant-baseline="central">alignOwned</text>
<text x="630" y="153" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">声明式对齐</text>

<path d="M394 170 L394 204" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="254" y="208" width="280" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="394" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">复制文件 + 写激活状态</text>
<text x="394" y="247" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">.activated-files.json</text>

<path d="M394 264 L394 298" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="234" y="302" width="320" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="394" y="322" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">写宿主入口文件（软适配宿主）</text>
<text x="394" y="341" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">大小写冲突时保留 canonical，输出 skipped 提示</text>

<rect x="40" y="386" width="638" height="60" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="62" y="408" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">安全边界</text>
<text x="62" y="429" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#5F5E5A" dominant-baseline="central">共享目录（.cursor/rules、.windsurf/rules）与 --target 目录一律不做全量对齐，避免误删用户自有内容</text>

<rect x="40" y="464" width="638" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="359" y="486" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">重复执行幂等：第二次激活时 Pruned = 0，存量用户升级残留会被一次性清理</text>
</svg>
